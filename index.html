<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }
        #ui-overlay {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 9999; padding: 15px 30px; 
            background: #0066b1; color: white; border: none; border-radius: 50px;
            font-family: Arial, sans-serif; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <button id="ui-overlay">VER INVITACIÓN</button>

    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; maxTrack: 1" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <video id="ar-video" src="./video.mp4" 
                   preload="auto" loop="true" 
                   crossOrigin="anonymous" 
                   playsinline webkit-playsinline>
            </video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" id="target-handler">
            <a-video 
                src="#ar-video" 
                position="0 0 0" 
                width="1" 
                height="1.413" 
                rotation="0 0 0">
            </a-video>
        </a-entity>
    </a-scene>

    <script>
        const video = document.querySelector('#ar-video');
        const button = document.querySelector('#ui-overlay');
        const sceneEl = document.querySelector('a-scene');
        const targetEl = document.querySelector('#target-handler');

        button.addEventListener('click', () => {
            sceneEl.systems["mindar-image-system"].start();
            video.play().then(() => {
                video.pause(); 
            });
            button.style.display = 'none';
        });

        targetEl.addEventListener("targetFound", () => {
            video.play();
        });

        targetEl.addEventListener("targetLost", () => {
            video.pause();
        });
    </script>
</body>
</html>
