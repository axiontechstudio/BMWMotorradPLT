<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; overflow: hidden; width: 100%; height: 100%; }
        .a-enter-vr, .a-enter-ar { display: none !important; }
        
        canvas {
            image-rendering: optimizeSpeed;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            transform: translateZ(0);
            will-change: transform;
        }

        #ui-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
            padding: 22px 48px;
            background: #000000;
            color: white;
            border: 2px solid #ffffff;
            border-radius: 50px;
            font-family: Arial, sans-serif;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            text-transform: uppercase;
            letter-spacing: 2px;
            -webkit-user-select: none;
            user-select: none;
            min-width: 260px;
            text-align: center;
            touch-action: manipulation;
        }

        #ui-overlay:active {
            transform: translate(-50%, -50%) scale(0.96);
        }

        #loading-screen {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000000;
            z-index: 9998;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
        }

        #loading-screen.visible {
            display: flex;
        }

        #loading-screen p {
            color: white;
            font-family: Arial, sans-serif;
            font-size: 16px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin: 0;
            opacity: 0.8;
        }

        #loading-screen .hint {
            color: white;
            font-family: Arial, sans-serif;
            font-size: 13px;
            opacity: 0.5;
            text-align: center;
            padding: 0 40px;
            line-height: 1.6;
            margin: 0;
            text-transform: none;
        }

        .spinner {
            width: 56px;
            height: 56px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #aim-message {
            display: none;
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9997;
            background: rgba(0,0,0,0.7);
            color: white;
            font-family: Arial, sans-serif;
            font-size: 15px;
            padding: 14px 28px;
            border-radius: 50px;
            text-align: center;
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.2);
        }

        #aim-message.visible {
            display: block;
        }

        #error-msg {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 15px;
            padding: 30px 40px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.3);
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <button id="ui-overlay">View Invitation</button>

    <div id="loading-screen">
        <div class="spinner"></div>
        <p id="loading-text">Solicitando permiso...</p>
        <p class="hint">Acepta el permiso de cámara<br>cuando tu teléfono lo pida</p>
    </div>

    <div id="aim-message">📷 Apunta la cámara a la invitación</div>

    <div id="error-msg">
        ⚠️ No se pudo acceder a la cámara.<br><br>
        Verifica que hayas dado permiso<br>e intenta recargar la página.
    </div>

    <a-scene
        mindar-image="
            imageTargetSrc: ./targets.mind;
            autoStart: false;
            maxTrack: 1;
            filterMinCF: 0.0001; 
            filterBeta: 0.001;
            missTolerance: 2;
            warmupTolerance: 3;
        "
        color-space="sRGB"
        renderer="colorManagement: true; physicallyCorrectLights: true; antialias: false; precision: highp;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        loading-screen="enabled: false">

        <a-assets timeout="30000">
            <video
                id="ar-video"
                src="./video.mp4"
                preload="auto"
                loop="true"
                playsinline
                webkit-playsinline
                crossorigin="anonymous">
            </video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false" wasd-controls="enabled: false"></a-camera>

        <a-entity
            mindar-image-target="targetIndex: 0"
            id="target-handler">
            <a-video
                src="#ar-video"
                position="0 0 0.001"
                width="1"
                height="1.413"
                rotation="0 0 0"
                material="shader: flat; side: front;">
            </a-video>
        </a-entity>
    </a-scene>

    <script>
        const video = document.querySelector('#ar-video');
        const button = document.querySelector('#ui-overlay');
        const sceneEl = document.querySelector('a-scene');
        const targetEl = document.querySelector('#target-handler');
        const loadingScreen = document.querySelector('#loading-screen');
        const loadingText = document.querySelector('#loading-text');
        const aimMessage = document.querySelector('#aim-message');
        const errorMsg = document.querySelector('#error-msg');

        let isTracking = false;
        let lostTimeout = null;

        function showAimMessage() {
            loadingScreen.classList.remove('visible');
            aimMessage.classList.add('visible');
        }

        button.addEventListener('click', () => {
            button.style.display = 'none';
            loadingScreen.classList.add('visible');
            loadingText.textContent = 'Iniciando cámara...';

            // 1. Desbloqueo síncrono para iOS (Sin promesas)
            video.play();
            video.pause();
            video.currentTime = 0;

            // 2. Separar la activación de la cámara del hilo actual
            setTimeout(() => {
                try {
                    sceneEl.systems['mindar-image-system'].start();
                } catch (e) {
                    console.error('Error al ejecutar MindAR:', e);
                    loadingScreen.classList.remove('visible');
                    errorMsg.style.display = 'block';
                }
            }, 300);
        });

        sceneEl.addEventListener('arError', (event) => {
            console.error('Error de cámara:', event);
            loadingScreen.classList.remove('visible');
            errorMsg.style.display = 'block';
        });

        sceneEl.addEventListener('arReady', () => {
            showAimMessage();
        });

        targetEl.addEventListener('targetFound', () => {
            isTracking = true;
            aimMessage.classList.remove('visible');

            if (lostTimeout) {
                clearTimeout(lostTimeout);
                lostTimeout = null;
            }
            
            // En iOS, verificar el estado de carga del video antes de forzar play
            if (video.readyState >= 2) {
                video.play().catch(e => console.warn('Error reproduciendo video:', e));
            } else {
                video.addEventListener('canplay', () => video.play(), { once: true });
            }
        });

        targetEl.addEventListener('targetLost', () => {
            isTracking = false;

            lostTimeout = setTimeout(() => {
                if (!isTracking) {
                    video.pause();
                    aimMessage.classList.add('visible');
                }
            }, 800);
        });

        // Evitar scroll accidental
        document.body.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
    </script>
</body>
</html>
