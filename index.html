<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #overlay {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            z-index: 1000; padding: 10px 20px; background: white; border: none; cursor: pointer;
        }
    </style>
</head>
<body>
    <button id="overlay">ACTIVAR AR / SONIDO</button>

    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; maxTrack: 1" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <video id="ar-video" src="./video.mp4" preload="auto" loop="true" crossOrigin="anonymous" playsinline></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" id="target-handler">
            <a-video src="#ar-video" position="0 0 0" height="0.5625" width="1" rotation="0 0 0"></a-video>
        </a-entity>
    </a-scene>

    <script>
        const video = document.querySelector('#ar-video');
        const button = document.querySelector('#overlay');
        const target = document.querySelector('#target-handler');

        // Los navegadores requieren un gesto del usuario para reproducir video con audio
        button.addEventListener('click', () => {
            video.play();
            video.pause(); // Pre-carga el video
            button.style.display = 'none';
        });

        // Optimización de Tracking: Reproducir solo cuando se ve la imagen
        target.addEventListener("targetFound", event => {
            console.log("Imagen detectada");
            video.play();
        });

        target.addEventListener("targetLost", event => {
            console.log("Imagen perdida");
            video.pause();
        });
    </script>
</body>
</html>
